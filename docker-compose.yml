services:
  postgres:
    image: postgres:16
    container_name: inejoma-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inejoma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inejoma}
      POSTGRES_DB: ${POSTGRES_DB:-inejoma}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inejoma}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: inejoma-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inejoma}:${POSTGRES_PASSWORD:-inejoma}@postgres:5432/${POSTGRES_DB:-inejoma}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: inejoma-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: inejoma-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
